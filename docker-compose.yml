version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: minecraft-panel-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minecraft-panel-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/minecraft-panel
      JWT_SECRET: your_jwt_secret_key
      PORT: 5000
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minecraft-panel-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app

volumes:
  mongodb_data:
